apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-postgres-exporter
  namespace: barofit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-postgres-exporter
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          args:
            - --collector.database
            - --collector.settings
            - --collector.stat_activity
            - --collector.stat_database
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: barofit-prod-postgres.czaikwsmwix7.ap-northeast-2.rds.amazonaws.com:5432/barofit?sslmode=verify-full&sslrootcert=/etc/rds-ca/global-bundle.pem&connect_timeout=5
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: barofit-rds-exporter
                  key: username
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: barofit-rds-exporter
                  key: password
            - name: PG_EXPORTER_COLLECTION_TIMEOUT
              value: 8s
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca
---
apiVersion: v1
kind: Service
metadata:
  name: rds-postgres-exporter
  namespace: barofit
  labels:
    app.kubernetes.io/name: rds-postgres-exporter
    barofit.io/metrics: postgres
spec:
  selector:
    app.kubernetes.io/name: rds-postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
