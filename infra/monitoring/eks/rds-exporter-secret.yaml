apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barofit-rds-exporter
  namespace: barofit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: barofit-prod-secrets-manager
  target:
    name: barofit-rds-exporter
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: barofit/prod/rds-exporter
