# Local development only. Install in namespace monitoring with release monitoring.
loki:
  fullnameOverride: loki
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 72h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    extraEnv:
      - name: GOMAXPROCS
        value: "1"
    sidecar: false
    persistence:
      enabled: true
      size: 5Gi
      whenDeleted: Retain
      whenScaled: Retain
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 1Gi
  gateway:
    enabled: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

alloy:
  fullnameOverride: alloy
  controller:
    type: deployment
    replicas: 1
  rbac:
    namespaces: [barofit]
    clusterRules: []
    rules:
      - apiGroups: [""]
        resources: [pods, pods/log]
        verbs: [get, list, watch]
  alloy:
    extraEnv:
      - name: GOMAXPROCS
        value: "1"
      - name: CLUSTER_NAME
        value: barofit-local
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 384Mi
    configMap:
      content: |
        discovery.kubernetes "barofit" {
          role = "pod"
          namespaces {
            names = {{ toJson .Values.rbac.namespaces }}
          }
        }
        discovery.relabel "barofit" {
          targets = discovery.kubernetes.barofit.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label = "service_name"
          }
          rule {
            target_label = "cluster"
            replacement = sys.env("CLUSTER_NAME")
          }
        }
        loki.source.kubernetes "barofit" {
          targets = discovery.relabel.barofit.output
          forward_to = [loki.process.barofit.receiver]
        }
        loki.process "barofit" {
          stage.multiline {
            firstline = "^(\\d{4}-\\d{2}-\\d{2}|\\{|[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)"
            max_wait_time = "3s"
            max_lines = 128
          }
          forward_to = [loki.write.local.receiver]
        }
        loki.write "local" {
          endpoint {
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

kube-prometheus-stack:
  fullnameOverride: monitoring
  kubelet:
    serviceMonitor:
      # Resource metrics cover local Pod CPU/memory without the full cAdvisor scrape.
      cAdvisor: false
      interval: 60s
      scrapeTimeout: 45s
      resource: true
      resourcePath: /metrics/resource
  prometheusOperator:
    env:
      GOMAXPROCS: "1"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 256Mi
    readinessProbe:
      timeoutSeconds: 5
    livenessProbe:
      timeoutSeconds: 5
  # minikube hides these components; avoid permanently failing scrape targets.
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  alertmanager:
    enabled: false
  grafana:
    defaultDashboardsEnabled: false
    env:
      GOMAXPROCS: "1"
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    deploymentStrategy:
      type: Recreate
    readinessProbe:
      timeoutSeconds: 10
    livenessProbe:
      timeoutSeconds: 30
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: ClusterIP
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 400m
        memory: 512Mi
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
  prometheus:
    prometheusSpec:
      containers:
        - name: prometheus
          env:
            - name: GOMAXPROCS
              value: "1"
      retention: 3d
      retentionSize: 4GB
      scrapeInterval: 30s
      evaluationInterval: 30s
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 5Gi

  kube-state-metrics:
    env:
      - name: GOMAXPROCS
        value: "1"
    livenessProbe:
      timeoutSeconds: 5
    readinessProbe:
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
  prometheus-node-exporter:
    env:
      GOMAXPROCS: "1"
    livenessProbe:
      timeoutSeconds: 5
    readinessProbe:
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 128Mi

barofit:
  namespace: barofit
