apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barofit-analytics-internal-token
  namespace: barofit
spec:
  secretStoreRef:
    name: barofit-prod-secrets-manager
    kind: ClusterSecretStore
  target:
    name: barofit-analytics-internal-token
    creationPolicy: Owner
  refreshInterval: 1h
  dataFrom:
    - extract:
        key: barofit/prod/internal-token
