apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workout-db-credentials
  namespace: barofit
spec:
  secretStoreRef:
    name: barofit-prod-secrets-manager
    kind: ClusterSecretStore
  target:
    name: workout-db-credentials
    creationPolicy: Owner
  refreshInterval: 1h
  dataFrom:
    - extract:
        key: barofit/prod/workout-db
