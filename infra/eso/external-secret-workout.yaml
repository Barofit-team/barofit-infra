apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workout-app-secrets
  namespace: barofit
spec:
  secretStoreRef:
    name: barofit-prod-secrets-manager
    kind: ClusterSecretStore
  target:
    name: workout-app-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  dataFrom:
    - extract:
        key: barofit/prod/workout
