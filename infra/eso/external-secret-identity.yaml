# PROFILE_IMAGE_* 4개(stale 값, barofit/prod/identity에 남아있음)는 의도적으로 제외한다.
# 올바른 값은 infra/values-prod.yaml의 ConfigMap이 담당하며, Secret에 이 키들이 존재하면
# envFrom 순서(ConfigMap -> Secret)상 Secret이 ConfigMap을 덮어써 버린다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-app-secrets
  namespace: barofit
spec:
  secretStoreRef:
    name: barofit-prod-secrets-manager
    kind: ClusterSecretStore
  target:
    name: identity-app-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: JWT_CURRENT_KID
      remoteRef:
        key: barofit/prod/identity
        property: JWT_CURRENT_KID
    - secretKey: GOOGLE_CLIENT_IDS
      remoteRef:
        key: barofit/prod/identity
        property: GOOGLE_CLIENT_IDS
    - secretKey: GOOGLE_WEB_CLIENT_ID
      remoteRef:
        key: barofit/prod/identity
        property: GOOGLE_WEB_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: barofit/prod/identity
        property: GOOGLE_CLIENT_SECRET
    - secretKey: KAKAO_APP_KEYS
      remoteRef:
        key: barofit/prod/identity
        property: KAKAO_APP_KEYS
    - secretKey: KAKAO_REST_API_KEY
      remoteRef:
        key: barofit/prod/identity
        property: KAKAO_REST_API_KEY
    - secretKey: KAKAO_CLIENT_SECRET
      remoteRef:
        key: barofit/prod/identity
        property: KAKAO_CLIENT_SECRET
    - secretKey: SOCIAL_REDIRECT_URIS
      remoteRef:
        key: barofit/prod/identity
        property: SOCIAL_REDIRECT_URIS
