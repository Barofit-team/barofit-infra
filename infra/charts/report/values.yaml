nameOverride: report-service

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

global:
  imageTag: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 234Mi
  limits:
    cpu: "1"
    memory: 256Mi

probe:
  timeoutSeconds: 5
  startupFailureThreshold: 120
  path: /actuator/health
  port: 8080

secrets:
  postgresSecretName: report-db-credentials
  jwtSecretName: barofit-jwt-keys
  jwtIncludePrivateKey: false
  appSecretName: ""
  extraSecretRefs: []

config:
  CORS_ALLOWED_ORIGINS: "http://localhost:8081"
  DB_URL: "jdbc:postgresql://barofit-prod-postgres.czaikwsmwix7.ap-northeast-2.rds.amazonaws.com:5432/barofit"
  JWT_PUBLIC_JWKS_PATH: /run/secrets/jwt/jwt-jwks.json
  WORKOUT_BASE_URL: "http://workout-service:8080"
  ROUTINE_BASE_URL: "http://routine-service:8080"
  # application.yaml 기본값(3008)이 아니라 컨테이너 내부 포트 8080으로 강제 (compose.yaml과 동일)
  REPORT_PORT: "8080"
  # compose.ec2.yaml의 JVM 튜닝(x-jvm-environment)을 그대로 적용 — 없으면 256Mi 제한에서 OOMKilled됨
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=33
    -XX:+UseSerialGC
    -XX:TieredStopAtLevel=1
    -XX:ReservedCodeCacheSize=32m
    -XX:MaxMetaspaceSize=112m
    -Xss512k
    -XX:+ExitOnOutOfMemoryError
  MALLOC_ARENA_MAX: "2"
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
  SERVER_TOMCAT_THREADS_MAX: "32"
  SERVER_TOMCAT_THREADS_MIN_SPARE: "2"

# Separate internal actuator listener; gateway forwards only the application port.
monitoring:
  enabled: true
  port: 9091
