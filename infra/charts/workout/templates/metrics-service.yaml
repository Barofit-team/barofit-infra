{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workout.name" . }}-metrics
  labels:
    barofit.io/metrics: application
    {{- include "workout.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workout.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.monitoring.port }}
      targetPort: metrics
{{- end }}
