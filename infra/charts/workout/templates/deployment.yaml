apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workout.name" . }}
  labels:
    {{- include "workout.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "workout.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workout.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "workout.selectorLabels" . | nindent 14 }}
      containers:
        - name: workout
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.global.imageTag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.monitoring.enabled }}
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "workout.name" . }}-config
            {{- if .Values.secrets.appSecretName }}
            - secretRef:
                name: {{ .Values.secrets.appSecretName }}
            {{- end }}
            {{- range .Values.secrets.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            {{- if .Values.monitoring.enabled }}
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.monitoring.port | quote }}
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADDADDITIONALPATHS
              value: "true"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS
              value: "true"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: {{ include "workout.name" . | quote }}
            {{- end }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresSecretName }}
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresSecretName }}
                  key: DB_PASSWORD
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/secrets/jwt
              readOnly: true
          startupProbe:
            timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
            httpGet:
              path: {{ .Values.probe.path }}
              port: {{ if .Values.monitoring.enabled }}metrics{{ else }}{{ .Values.probe.port }}{{ end }}
            periodSeconds: 5
            failureThreshold: {{ .Values.probe.startupFailureThreshold }}
          readinessProbe:
            timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
            httpGet:
              path: {{ .Values.probe.path }}
              port: {{ if .Values.monitoring.enabled }}metrics{{ else }}{{ .Values.probe.port }}{{ end }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
            httpGet:
              path: {{ .Values.probe.path }}
              port: {{ if .Values.monitoring.enabled }}metrics{{ else }}{{ .Values.probe.port }}{{ end }}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ .Values.secrets.jwtSecretName }}
            items:
              - key: jwt-jwks.json
                path: jwt-jwks.json
              {{- if .Values.secrets.jwtIncludePrivateKey }}
              - key: jwt-private.pem
                path: jwt-private.pem
              {{- end }}
