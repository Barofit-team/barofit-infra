apiVersion: v2
name: barofit
description: Umbrella chart (convenience wrapper only; each subchart stays independently installable). DB는 AWS RDS를 사용하므로 postgres 차트는 포함하지 않는다
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: identity
    version: "0.1.0"
    repository: "file://../charts/identity"
  - name: routine
    version: "0.1.0"
    repository: "file://../charts/routine"
  - name: workout
    version: "0.1.0"
    repository: "file://../charts/workout"
  - name: analytics
    version: "0.1.0"
    repository: "file://../charts/analytics"
  - name: report
    version: "0.1.0"
    repository: "file://../charts/report"
  - name: gateway
    version: "0.1.0"
    repository: "file://../charts/gateway"
