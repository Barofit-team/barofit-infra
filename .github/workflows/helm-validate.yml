name: BaroFit Helm CD Validation

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/helm-validate.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/helm-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3

      - name: Build Helm dependencies
        run: helm dependency update infra/umbrella

      - name: Lint Helm chart
        run: |
          helm lint infra/umbrella \
            -f infra/values-ecr-dev.yaml

      - name: Render Kubernetes manifests
        run: |
          helm template barofit infra/umbrella \
            --namespace barofit \
            -f infra/values-ecr-dev.yaml \
            > /tmp/barofit-rendered.yaml

      - name: Verify five ECR images render with a real tag
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="373514675861.dkr.ecr.ap-northeast-2.amazonaws.com"

          # 태그는 ecr-publish.yml이 main에 push될 때마다 커밋 SHA로 갱신하므로 고정값을
          # 검증하지 않는다 — 레포지토리당 "뭔가 비어있지 않은 태그"가 붙어 있는지만 확인한다.
          for SERVICE in identity routine workout analytics report; do
            IMAGE="${REGISTRY}/barofit-${SERVICE}"

            MATCH=$(grep -F "${IMAGE}:" /tmp/barofit-rendered.yaml | head -1 || true)

            if [ -z "${MATCH}" ]; then
              echo "FAIL: no image reference for ${IMAGE}"
              exit 1
            fi

            if echo "${MATCH}" | grep -Eq ":\s*\"?latest\"?\s*$"; then
              echo "FAIL: ${IMAGE} resolved to 'latest' (image.tag not set)"
              exit 1
            fi

            echo "PASS: ${MATCH}"
          done

      - name: Validation completed
        run: echo "BaroFit Helm validation passed"