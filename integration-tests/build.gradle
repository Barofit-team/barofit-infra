plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.barofit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

dependencies {
    // Spring 컨텍스트 없이 순수 HTTP 클라이언트로 배포된 환경(게이트웨이)을 호출한다.
    // identity/routine/runtime jar 의존은 전부 제거 — 이 모듈은 더 이상 어떤 서비스 코드도
    // 참조하지 않는다 (서비스 레포 분리 취지에 맞춤).
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson'
    // 로컬 배포용 키(../keys/jwt-private.pem)로 테스트 토큰을 직접 서명한다.
    // Spring Boot BOM이 이 아티팩트의 버전을 관리하지 않아 명시(identity 등에서 전이적으로
    // 들어오는 버전과 맞춤)
    testImplementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') { enabled = false }
tasks.named('bootRun') { enabled = false }
tasks.named('test') {
    useJUnitPlatform()
    // Test는 별도 JVM에서 돌아서 -D로 준 값이 자동으로 전달되지 않는다 — 명시적으로 중계한다.
    ['barofit.e2e.gateway-url', 'barofit.e2e.keys-dir'].each { key ->
        if (System.getProperty(key)) {
            systemProperty key, System.getProperty(key)
        }
    }
}

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
